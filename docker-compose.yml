services:
  postgres:
    image: postgres:16-alpine
    container_name: gsr-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gsr_user
      POSTGRES_PASSWORD: gsr_dev_password
      POSTGRES_DB: gamesitereview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsr_user -d gamesitereview"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gsr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gsr-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://gsr_user:gsr_dev_password@postgres:5432/gamesitereview?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=dev-secret-change-in-production-please
      - NEXTAUTH_URL=http://localhost:3000
      - TWITCH_CLIENT_ID=qlf3j232ufwxmko6s854ctkdwf03wg
      - TWITCH_CLIENT_SECRET=08hk42293v0as7516xmluruok4a1b0
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
